<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifas Guille - Presentador Parte 1</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
    text-align:center
}
.contenedor{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
}
.opciones{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0;
}
.opcion{
    width:50px;
    height:50px;
    border:2px solid #1565c0;
    border-radius:8px;
    background:white;
    font-size:22px;
    cursor:pointer;
}
.opcion.seleccionada{
    background:#1565c0;
    color:white;
}
button.enviar{
    width:100%;
    padding:15px;
    font-size:20px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>
<body>
<div class="contenedor">

<img src="Logo Rifas Guille.png" alt="Logo Rifas Guille" width="110">

<h1>RIFAS GUILLE</h1>
<h2>Siempre hay un ganador</h2>

<h2>Sorteo Dispositivo Watch Onn</h2>

<p>Fecha de sorteo 15 de agosto de 2026 a las 9 pm.</p>

<h2>Solo $7.000 x Número</h2>

<p>
1# = $7.000<br>
2# = $14.000<br>
3# = $21.000<br>
4# = $28.000<br>
5# = $35.000
</p>

<p>Bienvenido.</p>

<h2>¿Cuántos números desea comprar?</h2>

<div class="opciones">
    <button class="opcion" onclick="seleccionar(1)">1</button>
    <button class="opcion" onclick="seleccionar(2)">2</button>
    <button class="opcion" onclick="seleccionar(3)">3</button>
    <button class="opcion" onclick="seleccionar(4)">4</button>
    <button class="opcion" onclick="seleccionar(5)">5</button>
</div>

<button class="enviar">ENVIAR</button>

</div>

<script>
let cantidad = 1;

function seleccionar(valor){
    cantidad = valor;

    document.querySelectorAll('.opcion').forEach(b=>{
        b.classList.remove('seleccionada');
    });

    event.target.classList.add('seleccionada');
} document.querySelector('.enviar').addEventListener('click', function () {
    alert('¡Botón ENVIAR funcionando!');
});

// Selecciona 1 por defecto.
document.querySelector('.opcion').classList.add('seleccionada');
</script>

</body>
</html>
